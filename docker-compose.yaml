version: '3.8'


services:
  backend:
    build: ./backend
    container_name: ${BACKEND_SERVICE_NAME}
    expose: 
    - ${BACKEND_PORT}

    networks:
    - ${NETWORK_NAME}
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c = h.HTTPConnection('localhost', 8080, timeout=2); c.request('GET', '/'); r = c.getresponse(); exit(0) if r.status == 200 else exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ${NGINX_SERVICE_NAME}
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped


networks:
  app-network:
    driver: bridge

